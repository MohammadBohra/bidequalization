_schema-version: 3.3.0
ID: bid-equalization
description: SAP CAP Bid Equalization System for Procurement
version: 1.0.0
modules:
- name: bid-equalization-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: bid-equalization-auth
  - name: bid-equalization-db
  - name: qaforum-db
  - name: bid-equalization-destination
  - name: bid-equalization-connectivity
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: bid-equalization-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: bid-equalization-db
    properties:
      TARGET_CONTAINER: ~{hdi-container-name}
  - name: qaforum-db
    group: SERVICE_REPLACEMENTS
    properties:
      key: qaforum-db-key
      service: ~{the-service-name}
  parameters:
    buildpack: nodejs_buildpack
- name: bid-equalization-destinations
  type: com.sap.application.content
  requires:
  - name: bid-equalization-auth
    parameters:
      service-key:
        name: bid-equalization-auth-key
  - name: bid-equalization-html5-repo-host
    parameters:
      service-key:
        name: bid-equalization-html5-repo-host-key
  - name: srv-api
  - name: bid-equalization-destination
    parameters:
      content-target: true
  parameters:
    content:
      instance:
        destinations:
        - Name: bid-equalization-html5-repository
          ServiceInstanceName: bid-equalization-html5-repo-host
          ServiceKeyName: bid-equalization-html5-repo-host-key
          sap.cloud.service: bidequalization.service
        - Authentication: OAuth2UserTokenExchange
          Name: bid-equalization-auth
          ServiceInstanceName: bid-equalization-auth
          ServiceKeyName: bid-equalization-auth-key
          sap.cloud.service: bidequalization.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: bid-equalization-app-deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: bid-equalization-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - rfq-events.zip
      name: bidequalizationrfqevents
      target-path: resources/
    - artifacts:
      - freestyle-app.zip
      name: bidcomparison
      target-path: resources/
    - artifacts:
      - comaramcoformulaadminapp.zip
      name: comaramcoformulaadminapp
      target-path: resources/
- name: bidequalizationrfqevents
  type: html5
  path: app/rfq-events
  parameters:
    html5-app-name: bidequalizationrfqevents
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: bidcomparison
  type: html5
  path: app/freestyle-app
  parameters:
    html5-app-name: bidcomparison
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comaramcoformulaadminapp
  type: html5
  path: app/formula-admin-app
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: bid-equalization-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: bid-equalization-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: bid-equalization-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
  properties:
    hdi-container-name: ${service-name}
- name: qaforum-db
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: qaforum-db
  properties:
    the-service-name: ${service-name}
- name: bid-equalization-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: bidequalization-dest-service
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: bid-equalization-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: bid-equalization-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
