_schema-version: 3.3.0
ID: bid-equalization
version: 1.0.0
description: "SAP CAP Bid Equalization System for Procurement"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: bid-equalization-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: bid-equalization-auth
      - name: bid-equalization-db
      - name: bid-equalization-destination
      - name: bid-equalization-connectivity

  - name: bid-equalization-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: bid-equalization-db

  - name: bid-equalization-destinations
    type: com.sap.application.content
    requires:
      - name: bid-equalization-auth
        parameters:
          service-key:
            name: bid-equalization-auth-key
      - name: bid-equalization-html5-repo-host
        parameters:
          service-key:
            name: bid-equalization-html5-repo-host-key
      - name: srv-api
      - name: bid-equalization-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: bid-equalization-html5-repository
              ServiceInstanceName: bid-equalization-html5-repo-host
              ServiceKeyName: bid-equalization-html5-repo-host-key
              sap.cloud.service: bidequalization.service
            - Name: bid-equalization-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: bid-equalization-auth
              ServiceKeyName: bid-equalization-auth-key
              sap.cloud.service: bidequalization.service

  - name: bid-equalization-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: bid-equalization-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:        
        - name: bidequalizationrfqevents
          artifacts:
            - rfq-events.zip
          target-path: resources/
        - name: bidcomparison
          artifacts:
            - freestyle-app.zip
          target-path: resources/


  
  - name: bidequalizationrfqevents
    type: html5
    path: app/rfq-events
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
    parameters:
      html5-app-name: bidequalizationrfqevents
  
  - name: bidcomparison
    type: html5
    path: app/freestyle-app
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
    parameters:
      html5-app-name: bidcomparison

resources:
  - name: bid-equalization-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bid-equalization-${org}-${space}
        tenant-mode: dedicated
  - name: bid-equalization-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bid-equalization-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: bidequalization-dest-service
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
    requires:
      - name: srv-api

  - name: bid-equalization-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: bid-equalization-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
